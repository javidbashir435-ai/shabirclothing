function ledger(pid,from,to){const p=P(pid);let open=(p.drcr=='Cr'?-1:1)*(+p.opening||0),rows=[];
 sorted().filter(v=>v.party==pid).forEach(v=>{const s=VT[v.type][1],dr=s>0?v.amount:0,cr=s<0?v.amount:0;if(v.date<from)open+=dr-cr;else if(v.date<=to)rows.push({v,dr,cr})});
 let b=open;rows.forEach(r=>{b+=r.dr-r.cr;r.bal=b});return{open,rows,close:b}}

 const rows=vs.map(v=>{const sg=v.type=='SAL'||v.type=='PUR'?1:-1,qt=v.lines.reduce((a,l)=>a+ +l.q,0),gr=v.lines.reduce((a,l)=>a+l.q*l.rate,0);g+=sg*gr;d+=sg*(v.disc||0);n+=sg*v.amount;q+=sg*qt;return[v.date,v.no,VT[v.type][0],esc(pn(v.party)),qt,fmt(gr),fmt(v.disc||0),fmt(v.amount),act(v)]});
 return tbl(['Date','Vch No','Type','Party','>Qty','>Gross','>Discount','>Net Amount',''],rows,['','','','Net total (returns deducted)',q,fmt(g),fmt(d),fmt(n),''])}}
const R={
 r_day:{t:'Day Book',f:['from','to','type','party','q'],run:f=>{const vs=sorted().filter(v=>v.date>=f.from&&v.date<=f.to&&(!f.type||v.type==f.type)&&(!f.party||v.party==f.party)&&match(v,f.q));let dr=0,cr=0;
  return tbl(['Date','Vch No','Type','Party','Narration','>Debit','>Credit',''],vs.map(v=>{const s=VT[v.type][1];s>0?dr+=v.amount:cr+=v.amount;return[v.date,v.no,VT[v.type][0],esc(pn(v.party)),esc(v.narr||''),s>0?fmt(v.amount):'',s<0?fmt(v.amount):'',act(v)]}),['','','','','Total',fmt(dr),fmt(cr),''])}},
 r_sal:{t:'Sales Account / Register',f:['from','to','party','q'],run:reg(['SAL','SRT'])},
 r_pur:{t:'Purchase Account / Register',f:['from','to','party','q'],run:reg(['PUR','PRT'])},
 r_led:{t:'Ledger Statement (Party Account)',f:['from','to','party1'],run:f=>{if(!f.party)return'<p class="mu">Select a party to view the ledger statement.</p>';const p=P(f.party),l=ledger(f.party,f.from,f.to);let dr=0,cr=0;
  const rows=[['','','','Opening Balance','','',bs(l.open),''],...l.rows.map(r=>{dr+=r.dr;cr+=r.cr;return[r.v.date,r.v.no,VT[r.v.type][0],esc(r.v.narr||(r.v.lines?r.v.lines.length+' item(s)':r.v.mode||'')),r.dr?fmt(r.dr):'',r.cr?fmt(r.cr):'',bs(r.bal),act(r.v)]})];
  return`<div class="ph"><b>Account Statement – ${esc(p.name)}</b><br>${f.from} to ${f.to}</div><p><b>${esc(p.name)}</b> <span class="tag">${p.type}</span> ${esc(p.city)} ${esc(p.phone)} ${p.gstin?'GSTIN: '+esc(p.gstin):''}</p>`+tbl(['Date','Vch No','Type','Particulars','>Debit','>Credit','>Balance',''],rows,['','','','Closing Balance',fmt(dr),fmt(cr),bs(l.close),''])}},
 r_out:{t:'Party Outstanding / Balances',f:['to','st','q'],run:f=>{let d=0,c=0;const rows=S.parties.filter(p=>(p.name+p.city).toLowerCase().includes(f.q.toLowerCase())).map(p=>({p,b:ledger(p.id,'0000',f.to).close})).filter(x=>f.st=='Dr'?x.b>0:f.st=='Cr'?x.b<0:Math.abs(x.b)>.001).map(x=>{x.b>0?d+=x.b:c-=x.b;return[esc(x.p.name),x.p.type,esc(x.p.phone),esc(x.p.city),x.b>0?fmt(x.b):'',x.b<0?fmt(-x.b):'',`<button class="g" onclick="FL.party='${x.p.id}';go('r_led')">Ledger</button>`]});
  return tbl(['Party','Type','Phone','City','>To Receive (Dr)','>To Pay (Cr)',''],rows,['Total','','','',fmt(d),fmt(c),''])}},
 r_stk:{t:'Stock Report',f:['cat','q','low'],run:f=>{let tv=0,tq=0;const rows=S.items.filter(i=>(!f.cat||i.cat==f.cat)&&(i.name+i.size).toLowerCase().includes(f.q.toLowerCase())).map(i=>({i,s:stock(i.id)})).filter(x=>!f.low||x.s.q<=x.i.min).map(({i,s})=>{tv+=s.q*i.cost;tq+=s.q;return[esc(i.name),esc(i.cat),esc(i.size),s.o,s.inn,s.out,`<b class="${s.q<=i.min?'cr':''}">${s.q}</b>`,fmt(i.cost),fmt(s.q*i.cost)]});
  return tbl(['Item','Category','Size','>Opening','>In','>Out','>Stock','>Cost','>Value'],rows,['Total','','','','','',tq,'',fmt(tv)])}},
 r_pl:{t:'Profit & Loss / Account Summary',f:['from','to'],run:f=>{const sum=t=>S.vch.filter(v=>v.type==t&&v.date>=f.from&&v.date<=f.to).reduce((a,v)=>a+v.amount,0);const sa=sum('SAL')-sum('SRT'),pu=sum('PUR')-sum('PRT'),os=S.items.reduce((a,i)=>a+i.opening*i.cost,0),cs=S.items.reduce((a,i)=>a+stock(i.id).q*i.cost,0),gp=sa+cs-os-pu;
  const rc=sum('RCT'),py=sum('PAY');return tbl(['Particulars','>Amount'],[['Net Sales (Sales − Returns)',fmt(sa)],['Net Purchases (Purchase − Returns)',fmt(pu)],['Opening Stock (at cost)',fmt(os)],['Closing Stock (at cost)',fmt(cs)],['<b>Gross Profit</b>',`<b class="${gp>=0?'dr':'cr'}">${fmt(gp)}</b>`],['Total Receipts from parties',fmt(rc)],['Total Payments to parties',fmt(py)],['Total Receivable (all parties)',fmt(S.parties.reduce((a,p)=>a+Math.max(0,ledger(p.id,'0000','9999').close),0))],['Total Payable (all parties)',fmt(-S.parties.reduce((a,p)=>a+Math.min(0,ledger(p.id,'0000','9999').close),0))]])}}};

function delV(id){if(confirm('Delete this voucher?')){S.vch=S.vch.filter(v=>v.id!=id);save();draw()}}
// ---------- dashboard / settings ----------
function dash(){const m=today().slice(0,7),sm=t=>S.vch.filter(v=>v.type==t&&v.date.startsWith(m)).reduce((a,v)=>a+v.amount,0),sd=S.vch.filter(v=>v.type=='SAL'&&v.date==today()).reduce((a,v)=>a+v.amount,0);
 let rec=0,pay=0;S.parties.forEach(p=>{const b=ledger(p.id,'0000','9999').close;b>0?rec+=b:pay-=b});const sv=S.items.reduce((a,i)=>a+stock(i.id).q*i.cost,0),low=S.items.filter(i=>stock(i.id).q<=i.min).length;
 const k=(a,b,c='')=>`<div><small>${a}</small><b class="${c}">${b}</b></div>`;
 return`<div class="hero"><h2>Welcome, ${esc(B().name)}</h2><span class="tag">${new Date().toDateString()}</span></div><div class="kp">${k('Today Sales','₹'+fmt(sd))}${k('This Month Sales','₹'+fmt(sm('SAL')-sm('SRT')))}${k('This Month Purchase','₹'+fmt(sm('PUR')-sm('PRT')))}${k('Receivable (Debtors)','₹'+fmt(rec),'dr')}${k('Payable (Creditors)','₹'+fmt(pay),'cr')}${k('Stock Value (cost)','₹'+fmt(sv))}${k('Low-stock Items',low,low?'cr':'')}</div>
 <div class="card"><b>Latest transactions</b>${tbl(['Date','No','Type','Party','>Amount',''],sorted().slice(-10).reverse().map(v=>[v.date,v.no,VT[v.type][0],esc(pn(v.party)),fmt(v.amount),act(v)]))}</div>`}
function setView(){const b=B(),f=(k,l)=>`<label>${l}<input id="b_${k}" value="${esc(b[k])}"></label>`;
return`<h2>Settings</h2><div class="card"><h3 style="margin-top:0">🏪 Business Details</h3><div class="fm">${f('name','Business Name')}${f('tag','Tagline')}${f('addr','Address')}${f('phone','Phone')}${f('email','Email')}${f('gstin','GSTIN')}</div>
<h3>🏦 Bank & Payment Details <small class="mu">(shown on invoices)</small></h3><div class="fm">${f('bank','Bank Name')}${f('acname','Account Holder')}${f('acno','Account Number')}${f('ifsc','IFSC Code')}${f('upi','UPI ID')}</div>
<h3>📱 Payment QR Code</h3><div class="fm"><label>Upload QR image<input type="file" accept="image/*" onchange="upQR(this)"></label>${b.qr?`<div><img src="${b.qr}" style="width:110px;height:110px;object-fit:contain;border:1px solid var(--bd);border-radius:8px;background:#fff"><br><button class="d" onclick="collectBiz();S.biz.qr='';save();draw()">Remove QR</button></div>`:''}</div>
<label class="fm" style="display:block"><span class="mu" style="font-size:11px">Invoice Terms &amp; Conditions</span><textarea id="b_terms" rows="3" style="width:100%">${esc(b.terms)}</textarea></label><button onclick="saveBiz()">💾 Save Business Details</button></div>
<div class="card"><h3 style="margin-top:0">💾 Backup &amp; Restore</h3><p class="mu">Your data is stored in your Supabase cloud database. Also download a backup file regularly as an extra copy.</p><button onclick="dlBackup()">⬇ Download Backup File</button> <label style="display:inline-flex;margin-left:8px">Restore from file <input type="file" accept=".json" onchange="restoreFile(this)"></label>
<details style="margin-top:12px"><summary>Manual copy / paste backup</summary><textarea id="bk" rows="5" style="width:100%">${esc(JSON.stringify(S))}</textarea><button onclick="restore()">Restore from text</button></details><p><button class="d" style="padding:7px 14px" onclick="if(confirm('Erase ALL data?')){S=seed();save();go('dash')}">Reset all data</button></p></div>`}
function restore(){try{const d=JSON.parse($('#bk').value);if(!d.parties||!d.vch)throw 0;S=d;save();toast('Restored');go('dash')}catch(e){toast('Invalid backup text')}}
// ---------- shell ----------
const NAV=[['Main'],['dash','🏠 Dashboard'],['parties','👥 Parties / Ledgers'],['items','👕 Items & Stock'],['new','🧾 Voucher Entry'],['Reports'],['r_day','📖 Day Book'],['r_sal','💹 Sales Account'],['r_pur','🛒 Purchase Account'],['r_led','📒 Ledger Statement'],['r_out','⏳ Party Outstanding'],['r_stk','📦 Stock Report'],['r_pl','📊 Profit & Loss'],['System'],['set','⚙️ Settings & Backup'],['out','🚪 Logout']];
function go(v){if(v=='out')return logout();view=v;EDIT=null;EV=null;document.body.classList.remove('nv');draw();scrollTo(0,0)}
function draw(){const b=B();document.title=b.name+' – ERP';$('#nav').innerHTML=`<div class="brand"><b>${esc(b.name)}</b><span>Garments ERP · <i id="sy">${SY}</i></span></div>`+NAV.map(n=>n.length==1?`<h6>${n[0]}</h6>`:`<a class="${n[0]==view?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');$('#tt').textContent=b.name;
 $('#main').innerHTML=R[view]?repView():({dash,parties:partyView,items:itemView,new:newView,set:setView})[view]();if(view=='new')lines()}
document.addEventListener('click',e=>{if(e.target.closest('main'))document.body.classList.remove('nv')});
boot();
</script></body></html>
